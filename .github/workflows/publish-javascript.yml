name: Publish JavaScript

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "invalid release tag: $TAG" >&2; exit 1 ;; esac
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          sha="$(git rev-list -n 1 "$TAG")"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.tag.outputs.sha }}';
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              status: 'completed',
              per_page: 100,
            });
            const required = [
              'Python 3.11 / ubuntu-latest', 'Python 3.12 / ubuntu-latest',
              'Python 3.13 / ubuntu-latest', 'Python 3.14 / ubuntu-latest',
              'Python 3.11 / macos-latest', 'Python 3.12 / macos-latest',
              'Python 3.13 / macos-latest', 'Python 3.14 / macos-latest',
              'JavaScript peer / Bun',
              'Redis integration / Python 3.14',
            ];
            const passed = new Set(data.check_runs.filter(run => run.conclusion === 'success').map(run => run.name));
            const missing = required.filter(name => !passed.has(name));
            if (missing.length) core.setFailed(`tag commit ${sha} lacks successful checks: ${missing.join(', ')}`);

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@fire17/xo-state
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun test js/xo.test.js
      - run: bun pm pack --dry-run
      - run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
