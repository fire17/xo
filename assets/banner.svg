  <path d="M76 266h532" stroke="url(#wire)" stroke-width="3"/>
  <text x="78" y="296" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="14" fill="#718da6">LOCAL-FIRST · LAZY · BOUNDED · COMPOSABLE</text>
