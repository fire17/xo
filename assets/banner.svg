<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" role="img" aria-label="XO — one state graph, every boundary">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="0.58" stop-color="#101b30"/>
      <stop offset="1" stop-color="#17102a"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59d9ff"/>
      <stop offset="0.5" stop-color="#8fa8ff"/>
      <stop offset="1" stop-color="#d9a3ff"/>
    </linearGradient>
    <radialGradient id="pulse">
      <stop offset="0" stop-color="#59d9ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#59d9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <circle cx="1050" cy="170" r="165" fill="url(#pulse)"/>
