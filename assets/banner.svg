    <circle cx="1002" cy="92" r="8" fill="#0d1728" stroke-width="3"/>
    <circle cx="1002" cy="248" r="8" fill="#0d1728" stroke-width="3"/>
    <circle cx="1095" cy="92" r="8" fill="#0d1728" stroke-width="3"/>
    <circle cx="1095" cy="248" r="8" fill="#0d1728" stroke-width="3"/>
    <circle cx="1145" cy="170" r="13" fill="#0d1728" stroke-width="4" filter="url(#glow)"/>
    <circle cx="1220" cy="170" r="7" fill="#0d1728" stroke-width="3"/>
